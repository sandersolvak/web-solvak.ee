title: Note - wide image
icon: 🌁
num: '{{ page.date.toDate("Ymd") }}'


columns:
  - width: 2/3
    sections:
      info:
        type: fields
        fields:
          coverImage:
            label: Cover image
            type: files
            multiple: false
            query: page.images
            store: id
            layout: cards
            image:
              cover: true
          link:
            type: text
          text:
            type: textarea
          cover:
            label: Cover (old syntax)
            type: text
            help: For older posts only. New posts use Cover image above, which takes priority if both are set.


  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          date:
            type: date
            time: true
              unit: minute
              size: 1
            default: now

          tags:
            type: tags
      gallery:
        type: files
        layout: cards
        image:
          ratio: 1/1
